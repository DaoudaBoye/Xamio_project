<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180">
  <defs>

    <!-- Gradient bleu pour la moitié gauche du X -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FA3F7"/>
      <stop offset="100%" style="stop-color:#1255CC"/>
    </linearGradient>

    <!-- Gradient orange pour la moitié droite du X -->
    <linearGradient id="orangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00"/>
      <stop offset="100%" style="stop-color:#FFB300"/>
    </linearGradient>

    <!-- Ombre douce sur le X -->
    <filter id="xShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

  </defs>

  <!-- Fond sombre -->
  <rect width="560" height="180" fill="#0F1923"/>

  <!-- ══ X GÉOMÉTRIQUE BICOLORE ══
       Composé de 4 chevrons/flèches qui forment un X
       Moitié gauche = bleu, Moitié droite = orange
  -->
  <g transform="translate(30, 18)" filter="url(#xShadow)">

    <!-- MOITIÉ BLEUE — bras gauche du X (haut-gauche vers centre + bas-gauche vers centre) -->
    <!-- Bras haut-gauche -->
    <polygon points="0,0 28,0 72,72 44,72" fill="url(#blueGrad)"/>
    <!-- Bras bas-gauche -->
    <polygon points="0,144 28,144 72,72 44,72" fill="url(#blueGrad)" opacity="0.85"/>

    <!-- MOITIÉ ORANGE — bras droit du X (haut-droit vers centre + bas-droit vers centre) -->
    <!-- Bras haut-droit -->
    <polygon points="144,0 116,0 72,72 100,72" fill="url(#orangeGrad)"/>
    <!-- Bras bas-droit -->
    <polygon points="144,144 116,144 72,72 100,72" fill="url(#orangeGrad)" opacity="0.85"/>

    <!-- Reflet lumineux subtil au centre -->
    <polygon points="72,58 85,72 72,86 59,72" fill="white" fill-opacity="0.08"/>

  </g>

  <!-- ══ XAMIO — blanc, bold, espacé ══ -->
  <text
    x="210" y="108"
    font-family="'Trebuchet MS', 'Franklin Gothic Medium', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="72"
    fill="#FFFFFF"
    letter-spacing="-1">XAMIO</text>

</svg>
